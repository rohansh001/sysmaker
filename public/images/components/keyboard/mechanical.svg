<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Mechanical Gaming Keyboard -->
  <rect x="15" y="45" width="130" height="70" rx="6" fill="#13161f" stroke="#2d3345" stroke-width="2" />
  <!-- Keycaps Row 1 -->
  <g fill="#242938">
    <rect x="22" y="52" width="12" height="10" rx="1.5" />
    <rect x="36" y="52" width="12" height="10" rx="1.5" />
    <rect x="50" y="52" width="12" height="10" rx="1.5" />
    <rect x="64" y="52" width="12" height="10" rx="1.5" />
    <rect x="78" y="52" width="12" height="10" rx="1.5" />
    <rect x="92" y="52" width="12" height="10" rx="1.5" />
    <rect x="106" y="52" width="12" height="10" rx="1.5" />
    <rect x="120" y="52" width="18" height="10" rx="1.5" />
  </g>
  <!-- Keycaps Row 2 (WASD highlighted) -->
  <g fill="#242938">
    <rect x="22" y="66" width="15" height="10" rx="1.5" />
    <rect x="39" y="66" width="12" height="10" rx="1.5" fill="#e02477" />
    <rect x="53" y="66" width="12" height="10" rx="1.5" fill="#e02477" />
    <rect x="67" y="66" width="12" height="10" rx="1.5" fill="#e02477" />
    <rect x="81" y="66" width="12" height="10" rx="1.5" />
    <rect x="95" y="66" width="12" height="10" rx="1.5" />
    <rect x="109" y="66" width="12" height="10" rx="1.5" />
    <rect x="123" y="66" width="15" height="10" rx="1.5" />
  </g>
  <!-- Spacebar Row -->
  <rect x="45" y="94" width="70" height="11" rx="2" fill="#e02477" opacity="0.9" />
</svg>

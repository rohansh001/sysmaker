<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- RAM Stick 1 (Foreground) -->
  <g transform="translate(15, 45)">
    <!-- Heatspreader Body -->
    <rect x="0" y="0" width="130" height="50" rx="4" fill="#1c202a" stroke="#373e52" stroke-width="2" />
    <!-- Stylized Heatsink Fins -->
    <polygon points="10,0 20,-8 40,-8 50,0" fill="#2a3040" stroke="#3e475d" />
    <polygon points="60,0 70,-8 90,-8 100,0" fill="#2a3040" stroke="#3e475d" />
    <!-- Top RGB Light Diffusion Bar -->
    <rect x="4" y="2" width="122" height="8" rx="2" fill="#e02477" opacity="0.9" />
    <!-- Center Aluminum Badge -->
    <rect x="35" y="16" width="60" height="20" rx="3" fill="#13151c" stroke="#2c3242" />
    <text x="65" y="30" fill="#ffffff" font-size="10" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1">DDR4 RAM</text>
    <!-- PCB Base & Gold Contacts with DDR4 Key Notch -->
    <rect x="0" y="44" width="130" height="14" fill="#0f1117" stroke="#252a38" />
    <line x1="6" y1="52" x2="68" y2="52" stroke="#f59e0b" stroke-width="4" stroke-dasharray="3,1" />
    <!-- Notch at 72mm -->
    <rect x="70" y="48" width="6" height="10" fill="#0f1117" />
    <line x1="78" y1="52" x2="124" y2="52" stroke="#f59e0b" stroke-width="4" stroke-dasharray="3,1" />
  </g>
</svg>

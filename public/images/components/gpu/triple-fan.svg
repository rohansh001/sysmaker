<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <!-- Triple-Fan Heavyweight Gaming GPU -->
  <rect x="8" y="24" width="8" height="72" rx="1" fill="#64748b" stroke="#334155" />
  <rect x="16" y="26" width="176" height="68" rx="6" fill="#181a24" stroke="#363e52" stroke-width="2" />
  <!-- Neon Accent line -->
  <line x1="20" y1="30" x2="188" y2="30" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <!-- Fan 1 -->
  <circle cx="50" cy="60" r="21" fill="#0f1118" stroke="#2d3445" />
  <circle cx="50" cy="60" r="18" fill="none" stroke="#e02477" stroke-width="1.5" opacity="0.8" />
  <circle cx="50" cy="60" r="7" fill="#1f2430" />
  <!-- Fan 2 -->
  <circle cx="104" cy="60" r="21" fill="#0f1118" stroke="#2d3445" />
  <circle cx="104" cy="60" r="18" fill="none" stroke="#e02477" stroke-width="1.5" opacity="0.8" />
  <circle cx="104" cy="60" r="7" fill="#1f2430" />
  <!-- Fan 3 -->
  <circle cx="158" cy="60" r="21" fill="#0f1118" stroke="#2d3445" />
  <circle cx="158" cy="60" r="18" fill="none" stroke="#e02477" stroke-width="1.5" opacity="0.8" />
  <circle cx="158" cy="60" r="7" fill="#1f2430" />
  <!-- PCIe Connector -->
  <rect x="36" y="94" width="80" height="8" rx="1" fill="#0f1117" />
  <line x1="40" y1="98" x2="112" y2="98" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2,1" />
  <!-- Dual 8-Pin Power Header -->
  <rect x="156" y="20" width="28" height="6" rx="1" fill="#374151" />
</svg>

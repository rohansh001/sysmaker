<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="100%" height="100%">
  <!-- Dual-Fan Graphics Card -->
  <!-- Metal I/O Bracket -->
  <rect x="10" y="25" width="8" height="70" rx="1" fill="#64748b" stroke="#334155" />
  <!-- Main Card Shroud -->
  <rect x="18" y="28" width="148" height="64" rx="6" fill="#1c202a" stroke="#363e52" stroke-width="2" />
  <!-- Magenta / Pink Accent Edge -->
  <line x1="22" y1="32" x2="162" y2="32" stroke="#e02477" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Fan -->
  <circle cx="56" cy="60" r="24" fill="#111319" stroke="#2d3445" stroke-width="1.5" />
  <circle cx="56" cy="60" r="20" fill="none" stroke="#e02477" stroke-width="1.5" opacity="0.8" />
  <circle cx="56" cy="60" r="8" fill="#1f2430" />
  <!-- Right Fan -->
  <circle cx="124" cy="60" r="24" fill="#111319" stroke="#2d3445" stroke-width="1.5" />
  <circle cx="124" cy="60" r="20" fill="none" stroke="#e02477" stroke-width="1.5" opacity="0.8" />
  <circle cx="124" cy="60" r="8" fill="#1f2430" />
  <!-- PCIe Gold Connector -->
  <rect x="36" y="92" width="70" height="8" rx="1" fill="#0f1117" />
  <line x1="40" y1="96" x2="102" y2="96" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2,1" />
  <!-- 8-Pin Power Header -->
  <rect x="136" y="22" width="20" height="6" rx="1" fill="#374151" />
</svg>

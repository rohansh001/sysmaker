<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- ATX Desktop Power Supply Unit -->
  <!-- Metal Enclosure -->
  <rect x="18" y="22" width="124" height="116" rx="8" fill="#141720" stroke="#333a4c" stroke-width="2" />
  <!-- 120mm Intake Fan Grill -->
  <circle cx="70" cy="80" r="42" fill="#0d0f15" stroke="#252b38" stroke-width="2" />
  <!-- Honeycomb Mesh Effect -->
  <circle cx="70" cy="80" r="36" fill="none" stroke="#2a3140" stroke-width="1.5" stroke-dasharray="4,3" />
  <circle cx="70" cy="80" r="28" fill="none" stroke="#2a3140" stroke-width="1.5" stroke-dasharray="4,3" />
  <circle cx="70" cy="80" r="14" fill="#1c202a" stroke="#e02477" stroke-width="2" />
  <!-- 80 Plus Rating Badge -->
  <rect x="26" y="30" width="34" height="22" rx="3" fill="#fbbf24" opacity="0.95" />
  <text x="43" y="44" fill="#0f172a" font-size="8" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">80 PLUS</text>
  <text x="43" y="50" fill="#0f172a" font-size="5" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">BRONZE</text>
  <!-- Power AC Switch & Plug Socket -->
  <rect x="122" y="32" width="14" height="26" rx="2" fill="#252b3a" stroke="#3c455c" />
  <rect x="126" y="36" width="6" height="8" rx="1" fill="#ef4444" />
  <!-- Modular Cable Outlets -->
  <rect x="26" y="112" width="108" height="18" rx="3" fill="#0b0d12" stroke="#222634" />
  <circle cx="40" cy="121" r="3.5" fill="#333b4e" />
  <circle cx="56" cy="121" r="3.5" fill="#333b4e" />
  <circle cx="72" cy="121" r="3.5" fill="#333b4e" />
  <circle cx="88" cy="121" r="3.5" fill="#333b4e" />
  <circle cx="104" cy="121" r="3.5" fill="#e02477" />
  <circle cx="120" cy="121" r="3.5" fill="#e02477" />
</svg>

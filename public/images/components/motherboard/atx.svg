<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="moboPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e222e" />
      <stop offset="100%" stopColor="#12141c" />
    </linearGradient>
  </defs>
  <!-- Full ATX PCB -->
  <rect x="15" y="10" width="130" height="140" rx="6" fill="url(#moboPcb)" stroke="#373e54" stroke-width="2" />
  <!-- Mounting Holes -->
  <circle cx="24" cy="18" r="3" fill="#0f1118" stroke="#64748b" />
  <circle cx="136" cy="18" r="3" fill="#0f1118" stroke="#64748b" />
  <circle cx="24" cy="80" r="3" fill="#0f1118" stroke="#64748b" />
  <circle cx="136" cy="80" r="3" fill="#0f1118" stroke="#64748b" />
  <circle cx="24" cy="142" r="3" fill="#0f1118" stroke="#64748b" />
  <circle cx="136" cy="142" r="3" fill="#0f1118" stroke="#64748b" />
  <!-- Rear I/O Armor Shield -->
  <rect x="17" y="12" width="22" height="70" rx="3" fill="#151722" stroke="#2e354a" />
  <rect x="23" y="24" width="10" height="16" rx="1" fill="#e02477" opacity="0.8" />
  <!-- VRM Top & Left Heatsinks -->
  <rect x="42" y="14" width="48" height="16" rx="2" fill="#282f42" stroke="#3e4a68" />
  <rect x="36" y="32" width="14" height="42" rx="2" fill="#282f42" stroke="#3e4a68" />
  <!-- CPU Socket -->
  <rect x="54" y="34" width="38" height="38" rx="4" fill="#202534" stroke="#4b577a" />
  <rect x="59" y="39" width="28" height="28" rx="2" fill="#131622" />
  <!-- 4 DDR DIMM Slots -->
  <rect x="98" y="26" width="5" height="54" rx="1" fill="#0f1118" stroke="#475569" />
  <rect x="106" y="26" width="5" height="54" rx="1" fill="#0f1118" stroke="#e02477" stroke-width="1.5" />
  <rect x="114" y="26" width="5" height="54" rx="1" fill="#0f1118" stroke="#475569" />
  <rect x="122" y="26" width="5" height="54" rx="1" fill="#0f1118" stroke="#e02477" stroke-width="1.5" />
  <!-- Reinforced Primary PCIe x16 Slot (Gold contact look) -->
  <rect x="26" y="88" width="92" height="8" rx="2" fill="#0f121a" stroke="#c59b27" stroke-width="1.5" />
  <line x1="30" y1="92" x2="114" y2="92" stroke="#e02477" stroke-width="2" stroke-dasharray="3,1" />
  <!-- M.2 Aluminum Thermal Shield -->
  <rect x="42" y="100" width="50" height="10" rx="2" fill="#23293a" stroke="#475569" />
  <text x="67" y="108" fill="#cbd5e1" font-size="6" font-family="monospace" text-anchor="middle">M.2 NVMe</text>
  <!-- Secondary PCIe Slot -->
  <rect x="26" y="114" width="75" height="6" rx="1.5" fill="#0f121a" stroke="#373e54" />
  <!-- Chipset Heatsink with RGB accent -->
  <rect x="96" y="105" width="36" height="36" rx="4" fill="#1b1f2b" stroke="#373e54" />
  <rect x="100" y="109" width="28" height="28" rx="2" fill="#131620" />
  <text x="114" y="127" fill="#e02477" font-size="8" font-weight="900" text-anchor="middle">ATX</text>
</svg>

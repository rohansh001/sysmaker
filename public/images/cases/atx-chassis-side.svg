<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="100%" height="100%">
  <!-- Mid-Tower ATX Case Background & Frame -->
  <rect x="40" y="30" width="800" height="600" rx="16" fill="#14171f" stroke="#2b303e" stroke-width="2.5" />
  <!-- Rubber Chassis Feet -->
  <rect x="90" y="630" width="80" height="15" rx="3" fill="#090a0d" stroke="#222530" />
  <rect x="710" y="630" width="80" height="15" rx="3" fill="#090a0d" stroke="#222530" />
  <!-- Top Exhaust Mesh Panel -->
  <rect x="180" y="34" width="460" height="10" rx="3" fill="#0f1015" stroke="#222633" stroke-dasharray="3,3" />
  <!-- Front I/O Bezel -->
  <rect x="780" y="45" width="45" height="570" rx="6" fill="#12141a" stroke="#262b3a" />
  <circle cx="802" cy="75" r="7" fill="#2b303e" stroke="#3d4458" />
  <rect x="797" y="95" width="10" height="4" rx="1" fill="#3d4458" />
  <rect x="797" y="105" width="10" height="4" rx="1" fill="#3d4458" />
  <!-- Main Interior Hardware Tray -->
  <rect x="80" y="55" width="690" height="550" rx="8" fill="#0d0e13" stroke="#1f232e" stroke-width="1.5" />
  <!-- Bottom PSU Shroud Compartment -->
  <rect x="80" y="490" width="690" height="115" fill="#151720" stroke="#252a38" stroke-width="2" />
  <line x1="80" y1="490" x2="770" y2="490" stroke="#2b3142" stroke-width="2.5" />
</svg>
